[package]
name = "xcp_registry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Measurement and Calibration registry for XCP - pure Rust, no C dependency"
readme = "README.md"
# The .gitignore only ignores private notes, it is not part of the package
exclude = [".gitignore"]
keywords.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true

# docs.rs builds the documentation with all features, so feature-gated items are shown
[package.metadata.docs.rs]
all-features = true

#--------------------------------------------------------------------------------------
[features]

default = []

# Feature a2l_reader using a2lfile
# Enables loading A2L files into the registry and checking syntax
a2l_reader = ["dep:a2lfile"]

#--------------------------------------------------------------------------------------

[dependencies]

# Error handling
thiserror = "2.0.21"

# Logging
log = "0.4.35"

# Regular expression matching for registry object search
regex = "1.13.1"

# A generic serialization/deserialization framework
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# proc-macro that generates direct registry registration code (#[derive(McRegisterType)])
xcp_registry_derive = { path = "../xcp_registry_derive/", version = "=0.1.0" }

# A2L checker (optional)
a2lfile = { version = "3.5.1", optional = true }

#--------------------------------------------------------------------------------------
# Lint settings are shared, see [workspace.lints] in the root Cargo.toml
[lints]
workspace = true
