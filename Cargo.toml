[workspace]
resolver = "3"
members = ["xcp_registry", "xcp_registry_derive"]

#--------------------------------------------------------------------------------------
# Values shared by both crates, a crate takes one over with `<key>.workspace = true`
[workspace.package]
edition = "2024"
rust-version = "1.90"
authors = ["RainerZ"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RainerZ/xcp-registry"
keywords = ["xcp", "a2l", "asam", "calibration", "measurement"]
categories = ["automotive", "embedded"]

#--------------------------------------------------------------------------------------
# Lint settings shared by both crates, a crate takes them over with `[lints] workspace = true`
[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
too_many_arguments = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
len_zero = "allow"
manual_range_contains = "allow"
