[package]
name = "xcp_registry_derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["RainerZ"]
description = "Derive macro McRegisterType: generates direct xcp_registry registration code"
readme = "README.md"
keywords = ["xcp", "a2l", "asam", "calibration", "measurement"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RainerZ/xcp-registry"
categories = ["automotive", "embedded"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
xcp_registry = { path = "../xcp_registry" }

#--------------------------------------------------------------------------------------
# Lint settings, kept in the manifest so they travel with the crate
[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
too_many_arguments = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
len_zero = "allow"
manual_range_contains = "allow"
