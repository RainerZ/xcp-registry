[package]
name = "xcp_registry_derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Derive macro McRegisterType: generates direct xcp_registry registration code"
readme = "README.md"
keywords.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true

# docs.rs builds the documentation with all features, so feature-gated items are shown
[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
xcp_registry = { path = "../xcp_registry" }

#--------------------------------------------------------------------------------------
# Lint settings are shared, see [workspace.lints] in the root Cargo.toml
[lints]
workspace = true
